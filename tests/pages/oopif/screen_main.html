<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Screen Reporter - Main</title>
</head>
<body>
    <h1 id="main-heading">Main Page</h1>
    <iframe id="cross-origin-iframe" style="width:400px;height:300px;border:0;"></iframe>
    <script>
        var port = new URLSearchParams(location.search).get('port');
        if (port) {
            document.getElementById('cross-origin-iframe').src =
                'http://127.0.0.1:' + port + '/screen_reporter.html';
        }
    </script>
</body>
</html>
