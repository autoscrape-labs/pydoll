<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Waiting fixtures</title>
  <style>
    .hidden { display: none; }
    #hover-target { padding: 12px; }
  </style>
</head>
<body>
  <h1 id="title">Waiting fixtures</h1>

  <div id="spinner">Loading...</div>
  <div id="toggle">Visible for a moment</div>
  <button id="enable-me" type="button" disabled>Enable me</button>
  <div id="mount"></div>

  <button id="start" type="button">Start timers</button>
  <button id="fetch-data" type="button">Fetch data</button>
  <button id="fetch-missing" type="button">Fetch missing</button>
  <button id="fetch-empty" type="button">Fetch empty</button>
  <a id="go-next" href="waiting_next.html">Next page</a>
  <button id="push-state" type="button">Push state</button>

  <div id="hover-target">Hover me</div>
  <p id="hover-result">not hovered</p>
  <div id="dbl-target">Double-click me</div>
  <p id="dbl-result">0</p>
  <p id="click-result">0</p>

  <script>
    document.getElementById('start').addEventListener('click', function () {
      setTimeout(function () { document.getElementById('spinner').remove(); }, 300);
      setTimeout(function () { document.getElementById('toggle').classList.add('hidden'); }, 300);
      setTimeout(function () { document.getElementById('enable-me').disabled = false; }, 300);
      setTimeout(function () {
        var late = document.createElement('div');
        late.id = 'late';
        late.textContent = 'appended';
        document.getElementById('mount').appendChild(late);
        window.appReady = true;
      }, 300);
    });
    document.getElementById('fetch-data').addEventListener('click', function () {
      fetch('/api/data', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ q: 'prices' }) })
        .then(function (r) { return r.json(); })
        .then(function (data) { document.getElementById('title').textContent = 'total ' + data.total; });
    });
    document.getElementById('fetch-missing').addEventListener('click', function () {
      fetch('/api/missing').catch(function () {});
    });
    document.getElementById('fetch-empty').addEventListener('click', function () {
      fetch('/api/empty', { method: 'DELETE' }).catch(function () {});
    });
    document.getElementById('push-state').addEventListener('click', function () {
      history.pushState({}, '', '/app/checkout/42');
    });
    document.getElementById('hover-target').addEventListener('mouseover', function () {
      document.getElementById('hover-result').textContent = 'hovered';
    });
    var dbl = 0;
    document.getElementById('dbl-target').addEventListener('dblclick', function () {
      dbl += 1;
      document.getElementById('dbl-result').textContent = String(dbl);
    });
    var clicks = 0;
    document.getElementById('dbl-target').addEventListener('click', function () {
      clicks += 1;
      document.getElementById('click-result').textContent = String(clicks);
    });
  </script>
</body>
</html>
