  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_if_no_docstring: true
            inherited_members: true
            members_order: source
            separate_signature: true
            filters:
            - '!^_'
            - '!^__'
            merge_init_into_class: true
            docstring_section_style: spacy
            signature_crossrefs: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: false
            show_bases: true
            heading_level: 1

extra:   
  alternate:
    - name: English
      link: /docs/
      lang: en
    - name: Português (BR)
      link: /docs/pt/
      lang: pt
    - name: 中文
      link: /docs/zh/
      lang: zh

extra_css:
  - resources/stylesheets/termynal.css
  - resources/stylesheets/extra.css
  - resources/stylesheets/landing-theme.css

extra_javascript:
  - resources/scripts/termynal.js
  - resources/scripts/extra.js
  - https://unpkg.com/mermaid@10.0.0/dist/mermaid.min.js

markdown_extensions:
  - pymdownx.critic
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.keys
  - footnotes
  - admonition
  - markdown.extensions.attr_list
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html