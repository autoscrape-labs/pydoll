theme:
  name: material
  custom_dir: overrides
  font:
    text: Chivo
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: custom
    accent: indigo
  icon:
    repo: fontawesome/brands/github
    logo: material/lightning-bolt
  favicon: resources/images/favicon.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.path
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.select
    - content.tooltips
    - search.highlight
    - search.suggest
  
plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: false
      reconfigure_search: true
